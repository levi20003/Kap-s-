# Every push: web tests (rules + browser) and a full APK build with build.sh.
# The real build only proves it works. The phone-testable APK is a separate app (hu.fogasnaplo.app.teszt, "Kapás")
# that installs next to the real one; its CI-only key comes from the FOGASNAPLO_TESZT_SEED passphrase (fallback: Actions cache),
# and version.json carries its certificate digest so the app can tell a key change from a normal update.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04 # playwright install --with-deps needs an Ubuntu release this Playwright version supports
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the test build to the "teszt" release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK (platform 36, build-tools 36.0.0)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # The test app's key. Preferred: derived from the FOGASNAPLO_TESZT_SEED secret (a passphrase), so it is the same
      # forever. Fallback without the secret: a random CI key in the Actions cache, which GitHub evicts after 7 idle days
      # (then the test app on the phone cannot update and asks for a one-time reinstall).
      - name: Is the test-key passphrase set?
        id: seed
        env:
          SEED: ${{ secrets.FOGASNAPLO_TESZT_SEED }}
        run: |
          if [ -n "$SEED" ]; then echo "set=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::FOGASNAPLO_TESZT_SEED secret missing - the test key lives in the Actions cache and is lost after 7 idle days (store/KIADAS.md)"; fi
      - uses: actions/cache@v4
        if: steps.seed.outputs.set != '1'
        with:
          path: ci-key
          key: ci-test-signing-key-v1
      - name: CI-only signing key (never the real one)
        env:
          FOGASNAPLO_TESZT_SEED: ${{ secrets.FOGASNAPLO_TESZT_SEED }}
        run: |
          if [ -n "$FOGASNAPLO_TESZT_SEED" ]; then
            python3 -c "import cryptography" 2>/dev/null || python3 -m pip install -q --user --break-system-packages cryptography
            python3 tools/ci-teszt-kulcs.py ci-key
          elif [ ! -f ci-key/fogasnaplo.keystore ]; then
            mkdir -p ci-key
            keytool -genkeypair -keystore ci-key/fogasnaplo.keystore -alias fogasnaplo -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci-only-123 -keypass ci-only-123 -dname "CN=Fogasnaplo CI teszt"
            echo ci-only-123 > ci-key/keystore-jelszo.txt
          fi
          cp ci-key/fogasnaplo.keystore ci-key/keystore-jelszo.txt .
      - name: bundletool (Android App Bundle for Google Play)
        run: curl -sSfL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
      - run: AAB=1 ./build.sh 999 ci
      - name: The bundle installs as a working APK (universal APK from the AAB)
        run: |
          java -jar bundletool.jar build-apks --bundle=out/Fogasnaplo.aab --output=out/check.apks --mode=universal \
            --ks=fogasnaplo.keystore --ks-key-alias=fogasnaplo --ks-pass=file:keystore-jelszo.txt
          unzip -q -o out/check.apks universal.apk -d out
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging out/universal.apk | grep -E "^(package|targetSdkVersion|application-label):"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging out/universal.apk | grep -q "targetSdkVersion:'36'"
      - name: APK targets API 36 (Google Play requirement)
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging out/Fogasnaplo.apk | grep -E "^(package|sdkVersion|targetSdkVersion)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging out/Fogasnaplo.apk | grep -q "targetSdkVersion:'36'"
      - name: Test app for the phone (installs next to the real app)
        run: |
          APP_ID=hu.fogasnaplo.app.teszt LABEL="Kapás" ./build.sh $((1000 + GITHUB_RUN_NUMBER)) "$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)-${GITHUB_SHA::7}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging out/Fogasnaplo.apk | grep -E "^(package|application-label):"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging out/Fogasnaplo.apk | grep -q "name='hu.fogasnaplo.app.teszt'"
          mv out/Fogasnaplo.apk out/Fogasnaplo-TESZT.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs out/Fogasnaplo-TESZT.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ' \n' > out/cert.txt
          echo "signing cert: $(cat out/cert.txt)"; test -s out/cert.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fogasnaplo-TESZT-telefonra
          path: out/Fogasnaplo-TESZT.apk
          retention-days: 14
      # stable link for the phone (no login, no zip), and what the test app's update check reads
      - name: Publish test build to the "teszt" release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/fejlesztesek' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import json,os,subprocess; print(json.dumps({"versionCode":1000+int(os.environ["GITHUB_RUN_NUMBER"]),"versionName":os.environ["GITHUB_SHA"][:7],"notes":subprocess.check_output(["git","log","-1","--pretty=%s"],text=True).strip()[:120],"sha":os.environ["GITHUB_SHA"],"cert":open("out/cert.txt").read().strip()},ensure_ascii=False))' > out/version.json
          cat out/version.json
          gh release view teszt > /dev/null 2>&1 || gh release create teszt --prerelease --target "$GITHUB_SHA" --title "Kapás – tesztbuild" \
            --notes "A legutóbbi tesztverzió. Telefonon: koppints a Fogasnaplo-TESZT.apk fájlra. A valódi app mellé települ, annak adataihoz nem nyúl."
          gh release upload teszt out/Fogasnaplo-TESZT.apk --clobber   # the APK first, so version.json never points ahead of it
          gh release upload teszt out/version.json --clobber
